name: OKClean Threads publishing
on:
  schedule:
    - cron: '0 23 * * *' # 08:00 KST
    - cron: '0 7 * * *'  # 16:00 KST; 20:00 is manual only
  workflow_dispatch:
    inputs:
      mode:
        description: Read-only audit or eligible scheduled publication
        type: choice
        options: [audit, publish]
        default: audit
  push:
    branches: [main, fix/okclean-threads-isolation-20261117]
    paths: ['scripts/threads/**', 'scripts/okclean-threads-publish.mjs', 'tests/threads/**', '.github/workflows/okclean-threads.yml']
  pull_request:
    paths: ['scripts/threads/**', 'scripts/okclean-threads-publish.mjs', 'tests/threads/**', '.github/workflows/okclean-threads.yml']
permissions:
  contents: read
concurrency:
  group: okclean-threads-${{ github.event_name == 'schedule' && 'production' || github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install media validation tools
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Static and API mock tests
        run: |
          node --check scripts/okclean-threads-publish.mjs
          node --check scripts/threads/core.mjs
          for file in scripts/threads/*.mjs; do node --check "$file"; done
          node --test tests/threads/*.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==12.0.0
      - name: Media and source tests
        run: python -m unittest discover -s tests/threads -p 'test_*.py'
  audit:
    if: github.event_name != 'pull_request'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe owned Naver sources without republishing media
        run: timeout 90s python -u scripts/threads/probe-sources.py || echo '::warning::Source probe timed out; no media collection success recorded.'
      - name: Read-only account and actual history verification
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.OKC_THREADS_ACCESS_TOKEN }}
          THREADS_EXPECTED_USER_ID: ${{ vars.OKC_THREADS_EXPECTED_USER_ID }}
          THREADS_ENABLED: ${{ vars.OKC_THREADS_ENABLED }}
        run: node scripts/okclean-threads-publish.mjs audit
  publish:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'publish'))
    needs: [checks, audit]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: okclean-threads-publisher
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install media validation tools
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Prepare tomorrow's unapproved drafts using an approved provider
        env:
          OKC_AI_ENABLED: ${{ vars.OKC_AI_ENABLED }}
          OKC_OPENAI_API_KEY: ${{ secrets.OKC_OPENAI_API_KEY }}
          OKC_OPENAI_MODEL: ${{ vars.OKC_OPENAI_MODEL }}
        run: |
          node scripts/threads/prepare-next.mjs
          if ! git diff --quiet -- ops/threads-queue.json; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' add ops/threads-queue.json
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore: prepare unapproved OKClean drafts'
            git push origin HEAD:main
          fi
      - name: Validate and publish eligible approved post
        env:
          THREADS_ENABLED: ${{ vars.OKC_THREADS_ENABLED }}
          THREADS_MEDIA_ENABLED: ${{ vars.OKC_THREADS_MEDIA_ENABLED }}
          THREADS_ACCESS_TOKEN: ${{ secrets.OKC_THREADS_ACCESS_TOKEN }}
          THREADS_EXPECTED_USER_ID: ${{ vars.OKC_THREADS_EXPECTED_USER_ID }}
        run: node scripts/okclean-threads-publish.mjs publish
      - name: Keep ledger evidence even when persistence failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: okclean-threads-failed-state-${{ github.run_id }}
          path: |
            ops/threads-posted.json
            ops/threads-runtime.json
          retention-days: 30
      - name: Report blocked publication
        if: failure()
        run: echo '::error::OKClean Threads blocked. Inspect runtime report. Do not blindly rerun publication.'
