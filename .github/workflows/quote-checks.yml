name: Quote reception checks
on:
  pull_request:
    paths: ['quote/**', 'admin/quotes.*', 'app.js', 'analytics.js', 'index.html', 'ops/firestore.rules.quotes-20261116.txt', 'tests/quote*', 'package*.json', '.github/workflows/quote-checks.yml']
  push:
    branches: [main]
    paths: ['quote/**', 'admin/quotes.*', 'app.js', 'analytics.js', 'index.html', 'ops/firestore.rules.quotes-20261116.txt', 'tests/quote*', 'package*.json', '.github/workflows/quote-checks.yml']
permissions:
  contents: read
jobs:
  quote-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run test:quotes:rules
      - run: python -m unittest discover -s tests -p 'test_case_sync.py'
