name: Quote reception checks
on:
  pull_request:
    paths: ['notifications/**', 'tests/mail-notifications*', 'quote/**', 'admin/quotes.*', 'admin/index.html', 'admin/backup.*', 'admin/customer-backup-*', 'admin/analytics.html', 'app.js', 'member-sync.js', 'analytics.js', 'analytics-maintenance.js', 'analytics-config.js', 'index.html', 'ops/firestore.rules.quotes-20261116.txt', 'ops/firestore.rules.current.txt', 'tests/quote*', 'tests/member*', 'tests/analytics*', 'tests/backup*', 'package*.json', '.github/workflows/quote-checks.yml']
  push:
    branches: [main]
    paths: ['notifications/**', 'tests/mail-notifications*', 'quote/**', 'admin/quotes.*', 'admin/index.html', 'admin/backup.*', 'admin/customer-backup-*', 'admin/analytics.html', 'app.js', 'member-sync.js', 'analytics.js', 'analytics-maintenance.js', 'analytics-config.js', 'index.html', 'ops/firestore.rules.quotes-20261116.txt', 'ops/firestore.rules.current.txt', 'tests/quote*', 'tests/member*', 'tests/analytics*', 'tests/backup*', 'package*.json', '.github/workflows/quote-checks.yml']
permissions:
  contents: read
jobs:
  quote-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --ignore-scripts
      - run: npm run test:retention:rules
      - run: npm run test:quotes:rules
      - run: python -m unittest discover -s tests -p 'test_case_sync.py'
