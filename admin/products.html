<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>오케이청소 추천제품 관리</title><link rel="icon" href="../icon-192.png"><style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f5f7fb}body{margin:0}.wrap{max-width:900px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #e5e9f2;border-radius:16px;padding:16px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{font-size:13px;font-weight:700;color:#586174}input,textarea,select{width:100%;box-sizing:border-box;margin-top:5px;padding:11px;border:1px solid #dfe4ee;border-radius:10px;font:inherit}textarea{min-height:88px}.row{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:11px 14px;font-weight:800;cursor:pointer}.primary{background:#174aa6;color:#fff}.ghost{background:#eef2f8}.danger{background:#b42318;color:#fff}.muted{color:#6d7688;font-size:13px}.item{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start}.hidden{display:none!important}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.stat{background:#f7f9fc;border:1px solid #e5e9f2;border-radius:12px;padding:12px}.stat b{display:block;font-size:22px}.stat span{font-size:12px;color:#6d7688}.stat-table{width:100%;border-collapse:collapse;margin-top:12px;font-size:13px}.stat-table th,.stat-table td{padding:8px;border-bottom:1px solid #edf0f5;text-align:left}.stat-table td:nth-child(n+2),.stat-table th:nth-child(n+2){text-align:right}@media(max-width:640px){.grid{grid-template-columns:1fr}.item{grid-template-columns:1fr}.btn{width:100%}.stats{grid-template-columns:repeat(2,1fr)}}
</style></head><body><main class="wrap"><h1>추천제품 관리</h1><p class="muted">상품명과 쿠팡 파트너스 링크만 넣어도 됩니다. 이미지 URL과 설명은 선택사항입니다.</p>
<section class="card"><div class="row"><button id="login" class="btn primary">Google 관리자 로그인</button><button id="logout" class="btn ghost hidden">로그아웃</button></div><p id="msg" class="muted">로그인이 필요합니다.</p></section>
<section id="panel" class="hidden"><form id="form" class="card"><input type="hidden" id="id">
<div class="grid">
<label style="grid-column:1/-1">상품명<input id="name" required placeholder="예: 메디록스-S 살균소독제 300ml"></label>
<label style="grid-column:1/-1">쿠팡 파트너스 링크<input id="url" required type="url" placeholder="https://link.coupang.com/..."></label>
</div>
<p class="muted" style="margin:8px 0 0">기본 등록은 위 2개만 입력하면 됩니다.</p>
<details style="margin-top:12px"><summary style="cursor:pointer;font-weight:800">상세설정 열기</summary><div class="grid" style="margin-top:12px">
<label>카테고리<input id="category" placeholder="비우면 자동 추천"></label>
<label>정렬순서<input id="order" type="number" value="100"></label>
<label style="grid-column:1/-1">상품 이미지 URL<input id="image" type="url" placeholder="선택사항 · 비우면 기본 이미지 사용"></label>
<label style="grid-column:1/-1">짧은 설명<textarea id="description" placeholder="비우면 자동 문구 사용"></textarea></label>
<label>노출상태<select id="active"><option value="true">노출</option><option value="false">숨김</option></select></label>
</div></details>
<div class="row" style="margin-top:12px"><button class="btn primary" type="submit">저장</button><button class="btn ghost" type="button" id="reset">새 상품</button></div></form>
<section class="card"><div class="row" style="justify-content:space-between"><b>클릭 통계</b><button id="reloadStats" class="btn ghost" type="button">통계 새로고침</button></div>
<div class="stats">
  <div class="stat"><b id="stToday">0</b><span>오늘</span></div>
  <div class="stat"><b id="st7d">0</b><span>최근 7일</span></div>
  <div class="stat"><b id="st30d">0</b><span>최근 30일</span></div>
  <div class="stat"><b id="stTotal">0</b><span>최근 1,000건</span></div>
</div>
<div class="stats">
  <div class="stat"><b id="stShorts">0</b><span>쇼츠</span></div>
  <div class="stat"><b id="stReels">0</b><span>릴스</span></div>
  <div class="stat"><b id="stBlog">0</b><span>블로그</span></div>
  <div class="stat"><b id="stThreads">0</b><span>Threads</span></div>
</div>
<div class="stats">
  <div class="stat"><b id="stProfile">0</b><span>프로필/기타</span></div>
</div>
<div id="statList" class="muted" style="margin-top:10px">통계를 불러오는 중…</div></section>
<section class="card"><div class="row" style="justify-content:space-between"><b>등록 상품</b><button id="reload" class="btn ghost">새로고침</button></div><div id="list"></div></section></section>
<p><a href="./">관리자 메뉴로 돌아가기</a></p></main>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';import{getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';import{getFirestore,collection,getDocs,doc,setDoc,deleteDoc,serverTimestamp,query,orderBy,limit}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';
const c={apiKey:'AIzaSyA1jn9CDPiEg_Sg_aOlEeZjPy8P7ZoFOZw',authDomain:'okclean-admin.firebaseapp.com',projectId:'okclean-admin',appId:'1:665748095050:web:49d73ca0f28ec5f67ee6b3'},app=initializeApp(c),auth=getAuth(app),db=getFirestore(app),ADMIN_UID='H1MfdqGkFRZzU8qkqwXTsiKv3CO2',$=x=>document.getElementById(x);const p=new GoogleAuthProvider();p.setCustomParameters({prompt:'select_account'});
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function reset(){['id','name','category','url','image','description'].forEach(x=>$(x).value='');$('order').value=100;$('active').value='true'}$('reset').onclick=reset;$('login').onclick=()=>signInWithPopup(auth,p);$('logout').onclick=()=>signOut(auth);$('reload').onclick=load;$('reloadStats').onclick=loadStats;
async function loadStats(){try{
  const [clickSnap,productSnap]=await Promise.all([
    getDocs(query(collection(db,'product_clicks'),orderBy('at','desc'),limit(1000))),
    getDocs(query(collection(db,'products'),orderBy('order','asc')))
  ]);
  const names={}; productSnap.docs.forEach(d=>{names[d.id]=d.data().name||d.id});
  const rows=clickSnap.docs.map(d=>d.data()), now=new Date(), startToday=new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime(), day=86400000;
  let today=0,d7=0,d30=0; const bySrc={},byProduct={},byProductSrc={};
  for(const x of rows){
    const src=String(x.src||'other'); bySrc[src]=(bySrc[src]||0)+1;
    const product=String(x.product||'unknown'); byProduct[product]=(byProduct[product]||0)+1;
    byProductSrc[product]??={};
    byProductSrc[product][src]=(byProductSrc[product][src]||0)+1;
    const t=x.at?.toDate?.()?.getTime?.()||0;
    if(t>=startToday)today++;
    if(t>=now.getTime()-7*day)d7++;
    if(t>=now.getTime()-30*day)d30++;
  }
  $('stToday').textContent=today;$('st7d').textContent=d7;$('st30d').textContent=d30;$('stTotal').textContent=rows.length;
  $('stShorts').textContent=bySrc.shorts||0;$('stReels').textContent=bySrc.reels||0;$('stBlog').textContent=bySrc.blog||0;$('stThreads').textContent=bySrc.threads||0;
  $('stProfile').textContent=(bySrc.profile||0)+(bySrc.share||0)+(bySrc.other||0);
  const top=Object.entries(byProduct).sort((a,b)=>b[1]-a[1]).slice(0,10);
  $('statList').innerHTML=top.length?'<table class="stat-table"><thead><tr><th>상품</th><th>전체</th><th>쇼츠</th><th>블로그</th><th>Threads</th><th>릴스</th></tr></thead><tbody>'+top.map(([k,v])=>{const s=byProductSrc[k]||{};return '<tr><td>'+esc(names[k]||k)+'</td><td>'+v+'</td><td>'+(s.shorts||0)+'</td><td>'+(s.blog||0)+'</td><td>'+(s.threads||0)+'</td><td>'+(s.reels||0)+'</td></tr>'}).join('')+'</tbody></table>':'아직 기록된 클릭이 없습니다.';
}catch(e){$('statList').textContent='통계를 불러올 수 없습니다. Firestore 규칙 확인 필요: '+(e.code||e.message)}}
async function load(){let s;try{s=await getDocs(query(collection(db,'products'),orderBy('order','asc')))}catch(e){$('msg').textContent='상품 목록을 불러올 수 없습니다. Firestore 규칙 확인 필요: '+(e.code||e.message);return}const rows=s.docs.map(d=>({id:d.id,...d.data()}));$('list').innerHTML=rows.length?rows.map(x=>`<div class="card item"><div><b>${esc(x.name)}</b><div class="muted">${esc(x.category||'')} · ${x.active===false?'숨김':'노출'}</div><div class="muted">${esc(x.url||'')}</div></div><div class="row"><button class="btn ghost" data-edit="${esc(x.id)}">수정</button><button class="btn danger" data-del="${esc(x.id)}">삭제</button></div></div>`).join(''):'<p class="muted">등록 상품이 없습니다.</p>';window.rows=rows}
$('list').onclick=async e=>{const edit=e.target.dataset.edit,del=e.target.dataset.del;if(edit){const x=window.rows.find(v=>v.id===edit);for(const k of['name','category','url','image','description','order'])$(k).value=x[k]??'';$('id').value=x.id;$('active').value=String(x.active!==false);scrollTo({top:0,behavior:'smooth'})}if(del&&confirm('이 상품을 삭제할까요?')){await deleteDoc(doc(db,'products',del));load()}};
function autoCategory(name){const n=name.toLowerCase();if(/메디록스|살균|소독|방역/.test(n))return '살균·소독';if(/드릴|임팩|렌치|공구/.test(n))return '전동공구';if(/세제|클리너|청소/.test(n))return '청소용품';return '추천제품'}
$('form').onsubmit=async e=>{e.preventDefault();const id=$('id').value||crypto.randomUUID(),name=$('name').value.trim(),url=$('url').value.trim();if(!/^https:\/\/(link\.)?coupang\.com\//i.test(url)){if(!confirm('쿠팡 파트너스 링크 형식이 아닌 것 같습니다. 그래도 저장할까요?'))return}await setDoc(doc(db,'products',id),{name,category:$('category').value.trim()||autoCategory(name),url,image:$('image').value.trim(),description:$('description').value.trim()||'오케이청소가 소개하는 추천제품입니다.',order:Number($('order').value)||100,active:$('active').value==='true',updatedAt:serverTimestamp()},{merge:true});reset();$('msg').textContent='저장했습니다. 추천제품 페이지에 자동 반영됩니다.';load()};
onAuthStateChanged(auth,u=>{const ok=u&&u.uid===ADMIN_UID;$('panel').classList.toggle('hidden',!ok);$('login').classList.toggle('hidden',!!u);$('logout').classList.toggle('hidden',!u);$('msg').textContent=ok?'관리자 로그인 완료.':u?'등록된 관리자 계정이 아닙니다.':'로그인이 필요합니다.';if(ok){load();loadStats()}});
</script></body></html>
