<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>오케이청소 추천제품 관리</title><link rel="icon" href="../icon-192.png"><style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f5f7fb}body{margin:0}.wrap{max-width:900px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #e5e9f2;border-radius:16px;padding:16px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{font-size:13px;font-weight:700;color:#586174}input,textarea,select{width:100%;box-sizing:border-box;margin-top:5px;padding:11px;border:1px solid #dfe4ee;border-radius:10px;font:inherit}textarea{min-height:88px}.row{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:11px 14px;font-weight:800;cursor:pointer}.primary{background:#174aa6;color:#fff}.ghost{background:#eef2f8}.danger{background:#b42318;color:#fff}.muted{color:#6d7688;font-size:13px}.item{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start}.hidden{display:none!important}@media(max-width:640px){.grid{grid-template-columns:1fr}.item{grid-template-columns:1fr}.btn{width:100%}}
</style></head><body><main class="wrap"><h1>추천제품 관리</h1><p class="muted">상품명과 쿠팡 파트너스 링크만 넣어도 됩니다. 이미지 URL과 설명은 선택사항입니다.</p>
<section class="card"><div class="row"><button id="login" class="btn primary">Google 관리자 로그인</button><button id="logout" class="btn ghost hidden">로그아웃</button></div><p id="msg" class="muted">로그인이 필요합니다.</p></section>
<section id="panel" class="hidden"><form id="form" class="card"><input type="hidden" id="id"><div class="grid">
<label>상품명<input id="name" required placeholder="예: 계양 충전드릴"></label><label>카테고리<input id="category" placeholder="예: 전동공구"></label>
<label style="grid-column:1/-1">쿠팡 파트너스 링크<input id="url" required type="url" placeholder="https://link.coupang.com/..."></label>
<label style="grid-column:1/-1">상품 이미지 URL<input id="image" type="url" placeholder="선택사항"></label>
<label style="grid-column:1/-1">짧은 설명<textarea id="description" placeholder="선택사항"></textarea></label>
<label>정렬순서<input id="order" type="number" value="100"></label><label>노출상태<select id="active"><option value="true">노출</option><option value="false">숨김</option></select></label>
</div><div class="row" style="margin-top:12px"><button class="btn primary" type="submit">저장</button><button class="btn ghost" type="button" id="reset">새 상품</button></div></form>
<section class="card"><div class="row" style="justify-content:space-between"><b>등록 상품</b><button id="reload" class="btn ghost">새로고침</button></div><div id="list"></div></section></section>
<p><a href="./">관리자 메뉴로 돌아가기</a></p></main>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';import{getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';import{getFirestore,collection,getDocs,doc,setDoc,deleteDoc,serverTimestamp,query,orderBy}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';
const c={apiKey:'AIzaSyA1jn9CDPiEg_Sg_aOlEeZjPy8P7ZoFOZw',authDomain:'okclean-admin.firebaseapp.com',projectId:'okclean-admin',appId:'1:665748095050:web:49d73ca0f28ec5f67ee6b3'},app=initializeApp(c),auth=getAuth(app),db=getFirestore(app),ADMIN_UID='H1MfdqGkFRZzU8qkqwXTsiKv3CO2',$=x=>document.getElementById(x);const p=new GoogleAuthProvider();p.setCustomParameters({prompt:'select_account'});
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function reset(){['id','name','category','url','image','description'].forEach(x=>$(x).value='');$('order').value=100;$('active').value='true'}$('reset').onclick=reset;$('login').onclick=()=>signInWithPopup(auth,p);$('logout').onclick=()=>signOut(auth);$('reload').onclick=load;
async function load(){let s;try{s=await getDocs(query(collection(db,'products'),orderBy('order','asc')))}catch(e){$('msg').textContent='상품 목록을 불러올 수 없습니다. Firestore 규칙 확인 필요: '+(e.code||e.message);return}const rows=s.docs.map(d=>({id:d.id,...d.data()}));$('list').innerHTML=rows.length?rows.map(x=>`<div class="card item"><div><b>${esc(x.name)}</b><div class="muted">${esc(x.category||'')} · ${x.active===false?'숨김':'노출'}</div><div class="muted">${esc(x.url||'')}</div></div><div class="row"><button class="btn ghost" data-edit="${esc(x.id)}">수정</button><button class="btn danger" data-del="${esc(x.id)}">삭제</button></div></div>`).join(''):'<p class="muted">등록 상품이 없습니다.</p>';window.rows=rows}
$('list').onclick=async e=>{const edit=e.target.dataset.edit,del=e.target.dataset.del;if(edit){const x=window.rows.find(v=>v.id===edit);for(const k of['name','category','url','image','description','order'])$(k).value=x[k]??'';$('id').value=x.id;$('active').value=String(x.active!==false);scrollTo({top:0,behavior:'smooth'})}if(del&&confirm('이 상품을 삭제할까요?')){await deleteDoc(doc(db,'products',del));load()}};
$('form').onsubmit=async e=>{e.preventDefault();const id=$('id').value||crypto.randomUUID();await setDoc(doc(db,'products',id),{name:$('name').value.trim(),category:$('category').value.trim(),url:$('url').value.trim(),image:$('image').value.trim(),description:$('description').value.trim(),order:Number($('order').value)||100,active:$('active').value==='true',updatedAt:serverTimestamp()},{merge:true});reset();$('msg').textContent='저장했습니다.';load()};
onAuthStateChanged(auth,u=>{const ok=u&&u.uid===ADMIN_UID;$('panel').classList.toggle('hidden',!ok);$('login').classList.toggle('hidden',!!u);$('logout').classList.toggle('hidden',!u);$('msg').textContent=ok?'관리자 로그인 완료.':u?'등록된 관리자 계정이 아닙니다.':'로그인이 필요합니다.';if(ok)load()});
</script></body></html>
